<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Rounded Base -->
  <rect width="64" height="64" rx="16" fill="#0b0f17"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" fill-opacity="0.22" stroke="url(#bg)" stroke-width="2.5"/>
  
  <!-- Dynamic Packet Pulse Line -->
  <path d="M 12 34 L 22 34 L 27 18 L 37 46 L 42 30 L 46 34 L 52 34" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Interactive Glowing Nodes -->
  <circle cx="14" cy="34" r="3.5" fill="#2dd4bf" filter="url(#glow)"/>
  <circle cx="27" cy="18" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="37" cy="46" r="4" fill="#2dd4bf" filter="url(#glow)"/>
  <circle cx="50" cy="34" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
</svg>